# 設定後端 FastAPI 服務的上游伺服器
upstream backend_server {
    # 'backend' 是 docker-compose.yml 中 FastAPI 服務的名稱
    server backend:8000;
}

server {
    listen 80;
    # (可選) 處理靜態檔案的 location，如果有的話
    location /static {
        alias /path/to/your/static/files; # 這裡需要設定靜態檔案的路徑
    }

    # 處理所有 API 請求和根路徑
    location / {
        # --- CORS 解決方案開始 ---

        # 1. 直接處理預檢請求 (OPTIONS)
        # 當瀏覽器發送 OPTIONS 請求來確認是否可以跨域時，Nginx 直接回應，無需打擾後端服務
        if ($request_method = 'OPTIONS') {
            # 允許來自您前端開發環境的請求。生產環境請換成您的前端域名
            add_header 'Access-Control-Allow-Origin' 'http://localhost:5173';
            # 允許的 HTTP 方法
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            # 允許前端攜帶的請求標頭，'Authorization' 對於登入驗證至關重要
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With';
            # 允許瀏覽器傳送 cookie 等憑證
            add_header 'Access-Control-Allow-Credentials' 'true';
            # 設定預檢請求的快取時間，減少預檢次數
            add_header 'Access-Control-Max-Age' 86400;
            # 回應 204 No Content，表示預檢成功
            return 204;
        }

        # 2. 為所有非 OPTIONS 的實際請求添加 CORS 標頭
        # 'always' 參數確保即使發生錯誤或重新導向，標頭也會被加上
        add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # --- CORS 解決方案結束 ---


        # --- 原有的反向代理設定保持不變 ---
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 這一行在舊設定中是多餘的，因為 FastAPI 框架通常會自己處理
        # proxy_set_header Authorization $http_authorization;
        # 但如果您的 FastAPI 依賴 Nginx 轉發此標頭，可以保留
    }
}