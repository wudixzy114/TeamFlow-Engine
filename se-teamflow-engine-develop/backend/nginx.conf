# --- Upstream 設定 ---
upstream backend_server {
    server backend:8000;
    keepalive 1000;
}

server {
    listen 80;
    
    # --- DDoS/DoS 防禦設定區域 (應用區) ---
    
    # 3. 緩慢攻擊防禦 (Slowloris 防禦)
    # 如果客戶端由建立連線後，發送 header 或 body 太慢，直接斷開
#    client_body_timeout 10s;
#    client_header_timeout 10s;
    
    # 4. 限制上傳大小
    # 防止攻擊者發送巨大的請求 body 塞爆伺服器
    client_max_body_size 10M; 

    # (可選) 處理靜態檔案
    location /static/ {
        # Nginx 去容器內的 /var/www/static/ 目錄下找文件
        alias /var/www/static/;
        
        # 安全性設置 (可選)：禁止列出目錄文件，防止別人看到你有什麼文件
        autoindex off; 
    }

    location /protected_files/ {
        
        # 關鍵指令！
        # 這表示：只有 Nginx 內部請求 (如 X-Accel-Redirect) 可以訪問此處
        # 外部用戶若直接訪問 http://your-site/protected_files/... 會得到 404 Not Found
        internal; 

        # 告訴 Nginx 實際檔案在硬碟的哪裡
        alias /var/www/static/downloads/; 
    }


    # 處理所有 API 請求和根路徑
    location / {
        # --- 啟用 DDoS 防禦 ---
        
        # 應用請求頻率限制
        # burst=50: 允許瞬間突發流量達到 50 個請求 (緩衝區)
        # nodelay: 超過 rate 但在 burst 範圍內的請求立即處理，不延遲；超過 burst 則直接回傳 503 錯誤
        #limit_req zone=api_limit burst=1000 nodelay;

        # 應用並發連接限制
        # 限制單個 IP 同一時間只能有 30 個連接
        #limit_conn conn_limit 150;

        # --- CORS 解決方案 (保持你原本的設定) ---

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'http://localhost:5173';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With';
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # --- 反向代理設定 ---
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 當觸發限速時，Nginx 預設回傳 503，這裡可以自定義錯誤頁面或 JSON (選用)
        # error_page 503 = @limit_error;
    }
    
    # (選用) 自定義限速錯誤回傳
    # location @limit_error {
    #     default_type application/json;
    #     return 429 '{"error": "Too Many Requests"}';
    # }
}