user  nginx;
worker_processes  auto; # 自動根據 CPU 核心數開啟對應的 process

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

# 這裡是關鍵！修改打開文件數上限 (必須大於 worker_connections)
worker_rlimit_nofile 65535;

events {
    # 每個 process 允許的最大連接數 (預設是 1024，這就是你報錯的原因)
    # 總併發數 ≈ worker_processes * worker_connections
    worker_connections  10240; 
    use epoll; # Linux 建議開啟
    multi_accept on; # 允許一個 worker 同時接受多個新連接
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # 在高併發下，建議暫時關閉 access_log 或使用 buffer 減少 IO
    # access_log  /var/log/nginx/access.log  main;
    #access_log off; 

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on; # 防止網路擁塞，對於 API 服務很重要

    keepalive_timeout  65;
    
    # 包含原本的 server 設定
    include /etc/nginx/conf.d/*.conf;
}