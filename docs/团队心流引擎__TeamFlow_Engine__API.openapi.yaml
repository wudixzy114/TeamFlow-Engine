openapi: 3.0.1
info:
  title: 团队心流引擎 (TeamFlow Engine) API
  description: 为《团队心流引擎》应用提供后端服务的RESTful API。该API支持团队管理、每日状态签到、数据可视化和AI分析等核心功能。
  version: 1.2.1
tags:
  - name: Authentication
  - name: Teams
  - name: Check-ins
  - name: Flow Ritual
  - name: Dashboard
  - name: Recognition
  - name: Culture & Growth
  - name: User
paths:
  /auth/register/:
    post:
      summary: 用户注册
      deprecated: false
      description: 发送验证码到邮箱，用户名需>=5个字符的字母数字，密码需>=8个字符且包含大小写字母和数字。
      operationId: authRegister
      tags:
        - Authentication
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  title: 至少5位，仅限字母数字
                password:
                  type: string
                  title: 至少8位，需包含大小写字母和数字
                email:
                  type: string
              required:
                - username
                - password
                - email
            examples: {}
      responses:
        '201':
          description: 用户创建成功，验证码已发送
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
              example:
                message: >-
                  Verification code sent. Please check your email to activate
                  your account.
          headers: {}
        '400':
          description: 注册信息错误
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                  - detail
              examples:
                '2':
                  summary: 邮箱/用户名已注册
                  value:
                    detail: Email already registered
                '3':
                  summary: 密码格式错误
                  value:
                    detail: >-
                      Password must be at least 8 characters long, with at least
                      one uppercase letter, one lowercase letter, and one digit.
          headers: {}
        '429':
          description: 请求过于频繁
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                  - detail
              example:
                detail: 您请求验证码过于频繁，请在 45 秒后重试。
          headers: {}
      security: []
  /auth/login/:
    post:
      summary: 用户登录
      deprecated: false
      description: ''
      operationId: authLogin
      tags:
        - Authentication
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: 登录成功，返回 Token Pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                access: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refresh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          headers: {}
        '401':
          description: 登录失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                  - detail
              example:
                detail: Incorrect username or password
          headers: {}
      security: []
  /auth/token/refresh/:
    post:
      summary: 刷新Access Token
      deprecated: false
      description: ''
      operationId: refreshToken
      tags:
        - Authentication
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
      responses:
        '200':
          description: 刷新成功，返回新的 Access Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
              example:
                access: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          headers: {}
        '401':
          description: Token 无效或用户不存在
          content:
            application/json:
              schema:
                title: ''
                type: object
                properties:
                  detail:
                    type: string
                required:
                  - detail
              example:
                detail: User not found
          headers: {}
      security: []
  /auth/reset-password/:
    post:
      summary: 重置密码验证
      deprecated: false
      description: ''
      tags:
        - Authentication
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: 密码重置成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
              example:
                message: Password has been reset successfully.
          headers: {}
        '400':
          description: 验证码或密码格式错误
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                  - detail
              examples:
                '2':
                  summary: 验证码错误
                  value:
                    detail: Invalid or expired verification code.
                '3':
                  summary: 密码格式错误
                  value:
                    detail: >-
                      Password must be at least 8 characters long, with at least
                      one uppercase letter, one lowercase letter, and one digit.
          headers: {}
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                  - detail
              example:
                detail: User not found.
          headers: {}
      security: []
  /auth/forgot-password/:
    post:
      summary: 重置密码（发送验证码）
      deprecated: false
      description: 向邮箱发送验证码以重置密码，发送间隔为60s，用户不能在60s内连续请求，验证码有效期为10分钟
      tags:
        - Authentication
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: 请求成功（即使邮箱不存在也返回此状态码以防枚举攻击）
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
              example:
                message: >-
                  If an account with that email exists, a password reset code
                  has been sent.
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                  - detail
              example:
                detail: User not found.
          headers: {}
        '429':
          description: 请求过于频繁
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                  - detail
              example:
                detail: 请求过于频繁，请在 45 秒后重试。
          headers: {}
      security: []
  /auth/logout/:
    post:
      summary: 登出
      deprecated: false
      description: 将 Access Token 加入黑名单以实现登出。
      tags: []
      parameters:
        - name: Authorization
          in: header
          description: ''
          required: false
          example: Bearer <jwt>
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenPair'
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
          headers: {}
        '400':
          description: Token 类型错误
          content:
            application/json:
              schema:
                title: ''
                type: object
                properties:
                  detail:
                    type: string
                required:
                  - detail
          headers: {}
      security: []
  /auth/verify-email/:
    post:
      summary: 注册验证
      deprecated: false
      description: ''
      tags:
        - Authentication
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
              example:
                message: Successfully registered.
          headers: {}
        '400':
          description: 验证失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                  - detail
              examples:
                '2':
                  summary: 验证码错误
                  value:
                    detail: Invalid or expired verification code.
                '3':
                  summary: 验证过期
                  value:
                    detail: Verification expired. Please register again.
          headers: {}
      security: []
  /teams/{team_id}/members/:
    get:
      summary: 获取团队成员
      deprecated: false
      description: 获取团队所有者和成员列表，需要用户是该团队成员。
      tags:
        - Teams
      parameters:
        - name: team_id
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: 成功返回团队成员信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMembersResponse'
              example:
                owner:
                  id: e44d82f7-727b-417d-8152-09411d33261f
                  email: owner@example.com
                  username: team_owner
                  nickname: Owner
                members:
                  - id: e44d82f7-727b-417d-8152-09411d33261f
                  - id: a9b8c7d6-1111-2222-3333-444455556666
          headers: {}
        '404':
          description: 团队未找到或权限不足
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                  - detail
              example:
                detail: Team not found or permission denied
          headers: {}
      security: []
  /teams/{team_id}/delete/:
    delete:
      summary: 解散群组（管理员）
      deprecated: false
      description: 只有团队所有者可以解散团队。
      tags:
        - Teams
      parameters:
        - name: team_id
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: 解散成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
              example:
                message: Team deleted successfully.
          headers: {}
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                  - detail
              example:
                detail: Only the team owner can delete the team.
          headers: {}
      security: []
  /teams/{team_id}/kick/:
    delete:
      summary: 踢出组员（管理员）
      deprecated: false
      description: 只有团队所有者可以踢出成员，不能踢出自己。
      tags:
        - Teams
      parameters:
        - name: team_id
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KickMember'
      responses:
        '200':
          description: 踢出成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
              example:
                message: Member removed successfully.
          headers: {}
        '400':
          description: 逻辑错误
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                  - detail
              example:
                detail: Team owner cannot remove themselves.
          headers: {}
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                  - detail
              example:
                detail: Only the team owner can remove members.
          headers: {}
        '404':
          description: 成员不在团队中
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                  - detail
              example:
                detail: Member not found in this team.
          headers: {}
      security: []
  /teams/invitations/decline/:
    delete:
      summary: 拒绝加入群组
      deprecated: false
      description: 使用邀请码拒绝团队邀请。
      tags:
        - Teams
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteCode'
      responses:
        '200':
          description: 拒绝成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
              example:
                message: Team invitation declined successfully.
          headers: {}
        '404':
          description: 邀请不存在
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                  - detail
              example:
                detail: Invitation not found.
          headers: {}
      security: []
  /teams/{team_id}/modify/:
    put:
      summary: 修改群组信息（管理员）
      deprecated: false
      description: 只有团队所有者可以修改团队名称。
      tags:
        - Teams
      parameters:
        - name: team_id
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Teamname'
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
              example:
                message: Team modified successfully.
          headers: {}
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                  - detail
              example:
                detail: Only the team owner can modify the team.
          headers: {}
      security: []
  /teams/{team_id}/leave/:
    delete:
      summary: 退出群组 (管理員不能使用)
      deprecated: false
      description: 团队成员可以退出团队，所有者不能退出。
      tags:
        - Teams
      parameters:
        - name: team_id
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: 退出成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
              example:
                message: You have left the team successfully.
          headers: {}
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                  - detail
              example:
                detail: Team owner cannot leave the team.
          headers: {}
      security: []
  /teams/{team_id}/modify_owner/:
    put:
      summary: 更換群組管理者 (管理者)
      deprecated: false
      description: 只有当前团队所有者可以更换管理者。
      tags:
        - Teams
      parameters:
        - name: team_id
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamOwner'
      responses:
        '200':
          description: 更换成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
              example:
                message: Team owner modified successfully.
          headers: {}
        '400':
          description: 新所有者不能是自己
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                  - detail
              example:
                detail: New owner cannot be the same as the current owner.
          headers: {}
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                  - detail
              example:
                detail: Only the team owner can modify the team owner.
          headers: {}
        '404':
          description: 新所有者不存在
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                  - detail
              example:
                detail: New owner not found.
          headers: {}
      security: []
  /teams/:
    get:
      summary: 获取当前用户加入的团队列表
      deprecated: false
      description: ''
      operationId: listMyTeams
      tags:
        - Teams
      parameters: []
      responses:
        '200':
          description: 成功返回团队列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
              example:
                id: 1a2b3c4d-1111-2222-3333-444455556666
                name: Team Flow Project
                owner:
                  id: e44d82f7-727b-417d-8152-09411d33261f
                  username: owner
          headers: {}
      security: []
    post:
      summary: 创建一个新团队
      deprecated: false
      description: ''
      operationId: createTeam
      tags:
        - Teams
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreate'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
              example:
                message: Team created successfully
          headers: {}
      security: []
  /teams/{team_id}/invitations/:
    post:
      summary: 邀请成员加入团队
      deprecated: false
      description: 邀请指定邮箱/用户名的用户加入团队。
      operationId: inviteMember
      tags:
        - Teams
      parameters:
        - name: team_id
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailORUsername'
      responses:
        '201':
          description: 邀请已发送
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
              example:
                message: The invitation has been sent successfully.
          headers: {}
        '400':
          description: 邀请失败（用户不存在、已是成员、已有邀请等）
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                  - detail
              examples:
                '2':
                  summary: 用户不存在
                  value:
                    detail: User not found
                '3':
                  summary: 已有邀请
                  value:
                    detail: This user already has a pending invitation
                '4':
                  summary: 已是成员
                  value:
                    detail: User is already a member of this team
          headers: {}
      security: []
  /teams/invitations/accept/:
    post:
      summary: 接受团队邀请
      deprecated: false
      description: 使用邀请码接受团队邀请并加入团队。
      operationId: acceptInvitation
      tags:
        - Teams
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteCode'
      responses:
        '200':
          description: 成功加入团队
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
              example:
                message: 'Successfully joined the team: Project Alpha.'
          headers: {}
        '400':
          description: 邀请码无效
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                  - detail
              example:
                detail: >-
                  Invalid or expired invitation code, or this invitation is not
                  for you.
          headers: {}
      security: []
  /teams/{team_id}/checkins/:
    post:
      summary: 为指定团队提交今日签到
      deprecated: false
      description: 提交挑战感、能力感和可选的文本描述。一天只能签到一次。
      operationId: createCheckin
      tags:
        - Check-ins
      parameters:
        - name: team_id
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinCreate'
      responses:
        '201':
          description: 签到成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
              example:
                message: Check-in successful.
          headers: {}
        '400':
          description: 重复签到
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                  - detail
              example:
                detail: You have already checked in for this team today.
          headers: {}
      security: []
  /teams/{team_id}/checkins/today/:
    get:
      summary: 检查当前用户今天是否已签到
      deprecated: false
      description: ''
      operationId: checkTodayStatus
      tags:
        - Check-ins
      parameters:
        - name: team_id
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 返回今日签到状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_checked_in:
                    type: boolean
                required:
                  - has_checked_in
              example:
                has_checked_in: true
          headers: {}
      security: []
  /teams/{team_id}/flow-sessions/:
    get:
      summary: 查看flow_session记录
      deprecated: false
      description: 返回当前用户在该团队的所有心流会话记录。
      tags:
        - Flow Ritual
      parameters:
        - name: team_id
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: 成功返回记录列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReturnFlowSession'
              example:
                id: e1234567-abcd-1234-5678-000000000001
