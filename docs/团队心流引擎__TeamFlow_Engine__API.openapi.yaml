components:
  schemas:
    InviteInfo:
      type: object
      properties:
        team_id:
          type: string
        team_name:
          type: string
        invite_code:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        inviter_username:
          type: string
      required:
        - team_id
        - team_name
        - invite_code
        - status
        - created_at
        - inviter_username
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    ResetPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          description: 6位验证码
          minLength: 6
          maxLength: 6
        new_password:
          type: string
          description: 至少8位，需包含大小写字母和数字
      required:
        - email
        - code
        - new_password
    WeeklyDigestData:
      type: object
      properties:
        week_range:
          type: object
          properties:
            start:
              type: string
              format: date
            end:
              type: string
              format: date
          required:
            - start
            - end
        mindset_trend:
          $ref: '#/components/schemas/CompassData'
        total_focus_hours:
          type: number
        top_booster:
          type: string
          nullable: true
        top_blocker:
          type: string
          nullable: true
        kudos_received:
          type: integer
      required:
        - week_range
        - mindset_trend
        - total_focus_hours
        - kudos_received
    EmailVerificationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          description: 6位验证码
          minLength: 6
          maxLength: 6
      required:
        - email
        - code
    UserCreate:
      type: object
      properties:
        username:
          type: string
